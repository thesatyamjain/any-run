<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171c"/>
      <stop offset="100%" stop-color="#0c0e11"/>
    </linearGradient>

    <!-- Amber Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Cyan Gateway Pulse -->
    <radialGradient id="cyanPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="1"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Glow Filter -->
    <filter id="amberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#252b34" stroke-width="6"/>

  <!-- Subtle Inner Grid / Tech Geometry Lines -->
  <path d="M 64 256 L 448 256" stroke="#1c2027" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M 256 64 L 256 448" stroke="#1c2027" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- AnyRun Energy Bolt Symbol -->
  <polygon points="278,74 116,280 252,280 234,438 396,232 260,232"
           fill="url(#boltGrad)"
           filter="url(#amberGlow)"
           stroke="#fde68a"
           stroke-width="3"
           stroke-linejoin="round"/>

  <!-- Tunnel Gateway Indicator Pulse (Bottom Right) -->
  <circle cx="390" cy="390" r="32" fill="url(#cyanPulse)"/>
  <circle cx="390" cy="390" r="10" fill="#22d3ee" stroke="#ecfeff" stroke-width="3"/>
</svg>
