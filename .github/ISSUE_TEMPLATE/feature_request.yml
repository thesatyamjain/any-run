name: Feature Request
description: Suggest an idea or enhancement for AnyRun
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make AnyRun even faster or support new frameworks? We'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or a new workflow?
      placeholder: A clear description of what you're trying to achieve.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've evaluated?
